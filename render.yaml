services:
  - type: web
    name: lanternbell-voice
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate:postgres
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: lanternbell-voice-db
          property: connectionString
      - key: POSTGRES_POOL_MAX
        value: "10"
      - key: RATE_LIMIT_PER_WINDOW
        value: "120"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: CALL_ALERT_LONG_TURN_MS
        value: "1500"
      - key: CALL_ALERT_REPEATED_PROMPT_COUNT
        value: "3"
      - key: SERVICE_NAME
        value: lanternbell-voice
      - key: SERVICE_VERSION
        value: 0.1.0
      - key: FIRST_CALL_EXTRACTOR
        value: deterministic
      - key: CALLER_LANGUAGE_MODE
        value: deterministic
      - key: CALLER_LANGUAGE_OPENAI_MODEL
        value: gpt-5.6-luna
      - key: CALLER_LANGUAGE_OPENAI_TIMEOUT_MS
        value: "1200"
      - key: CALLER_LANGUAGE_OPENAI_INPUT_USD_PER_MILLION
        value: "0.20"
      - key: CALLER_LANGUAGE_OPENAI_CACHED_INPUT_USD_PER_MILLION
        value: "0.02"
      - key: CALLER_LANGUAGE_OPENAI_CACHE_WRITE_USD_PER_MILLION
        value: "0.25"
      - key: CALLER_LANGUAGE_OPENAI_OUTPUT_USD_PER_MILLION
        value: "1.20"
      - key: CALLER_LANGUAGE_OPENAI_PRICING_VERSION
        value: openai-public-2026-07-30
      - key: TWILIO_HANDOFF_MODE
        value: simulate
      - key: TWILIO_VOICE_MODE
        value: gather
      - key: TWILIO_CONVERSATION_RELAY_PUBLIC_BASE_URL
        value: wss://voice.lanternbell.com
      - key: TWILIO_CONVERSATION_RELAY_SPEECH_MODEL
        value: flux
      - key: TWILIO_CONVERSATION_RELAY_EOT_THRESHOLD
        value: "0.85"
      - key: TENANT_API_KEYS
        sync: false
      - key: OPERATOR_USERS_JSON
        sync: false
      - key: OPERATOR_SESSION_ABSOLUTE_MINUTES
        value: "480"
      - key: OPERATOR_SESSION_IDLE_MINUTES
        value: "30"
      - key: OPERATOR_COOKIE_SECURE
        value: "true"
      - key: TENANT_CONFIGS_JSON
        sync: false
      - key: TELEPHONY_WEBHOOK_SECRETS
        sync: false
      - key: DATA_PURGE_AUDIT_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

databases:
  - name: lanternbell-voice-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "18"
    databaseName: lanternbell_voice
    user: lanternbell_voice
    ipAllowList: []
